061M:          Qw3-061M-eA-pE-tG-vN.flac
061M@ref:      Si è chinata sul lettino e ha sistemato la coperta con delicatezza. Dormi, piccolo mio, è tutto a posto. La mamma è qui e non se ne va. Domani andiamo insieme al parco a dare da mangiare alle anatre, come ti avevo promesso. Adesso chiudi gli occhi e sogna qualcosa di bello.

062M:          Qw3-062M-eA-pE-tN-vN.flac
062M@ref:      È salita sul tavolo e ha alzato la mano finché tutti hanno taciuto. Ascoltatemi bene, perché lo dico una volta sola. Nessuno lascia questa sala senza il mio permesso. Voi due controllate le uscite, tu chiama la centrale. Fra dieci minuti voglio un rapporto completo sulla mia scrivania. Muoversi!

063M:          Qw3-063M-eA-pE-tG-vN.flac
063M@ref:      È entrata in cucina saltellando, con la lettera in mano. L'ho avuto! Mi hanno presa, capisci? Il posto è mio! Cominciamo a settembre, e c'è perfino una terrazza che dà sul mare. Stasera si festeggia, apri quella bottiglia buona che tieni da parte da anni, ché l'occasione è arrivata davvero!

064M:          Qw3-064M-eA-pM-tG-vN.flac
064M@ref:      Si è avvicinata piano e ha abbassato la voce. Non dirlo a nessuno, mi raccomando. Domani sera, quando tutti saranno a cena, ci vediamo dietro la vecchia serra. Porta la chiave e una torcia. Se qualcuno ti chiede dove vai, inventa una scusa qualsiasi, ma non fare il mio nome.

065M:          Qw3-065M-eA-pN-tG-vN.flac
065M@ref:      Ha guardato il disastro sul tavolo e ha incrociato le braccia. Ma bravo, complimenti davvero. Un lavoro magnifico, proprio come avevi promesso. Immagino che anche stavolta la colpa sia del computer, oppure del tempo, oppure di qualcun altro. Tu, naturalmente, non c'entri mai niente, vero?

066M:          Qw3-066M-eV-pE-tG-vN.flac
066M@ref:      Ha preso la vecchia fotografia dal cassetto e l'ha guardata a lungo, in silenzio. Eravamo così giovani, allora. Lui rideva sempre, anche quando le cose andavano male. Ogni mattina mi aspetto ancora di sentirlo fischiettare in cucina. E invece la casa resta vuota, e io non so più che cosa fare.

